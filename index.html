<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polymath Cheatsheet Maker</title>

<style>
  /* =========================================================================
     POLYMATH CHEATSHEET MAKER
     -------------------------------------------------------------------------
     Build a printable cheatsheet by laying out modular rectangle tiles on
     an A4 / Letter / A3 page. Each tile holds rich text and (optionally) a
     pasted image — drag tiles to reposition, drag corner/edge handles to
     resize, paste pictures with Ctrl/⌘+V, change font size with A− / A+
     (bullets and numbers scale with the text), pick a tile colour, etc.

     This is a single, self-contained HTML file. Everything autosaves to
     localStorage so a refresh keeps your work. Export → Print/PDF prints
     the whole sheet at its native page size, with the Polymath logo and
     copyright footer in the bottom-right of every page.

     Architectural notes
     -------------------
     • One CHEATSHEET = { pageSize, orientation, title, subtitle, tiles[] }
     • One TILE = { id, x, y, w, h, color, html (rich text), image (slot
       with placement / scale / offsets) }
     • Tile coords + dimensions are stored in mm so they're page-relative
       and resolution-independent. A `mmToPx()` helper converts to screen
       pixels using the page's actual pixel width.
     • Paper is rendered as an inert "sheet" div sized via @page-style
       width × height in mm. Tiles are absolutely positioned inside.
     • Print mode uses an @page rule injected from JS so the printed PDF
       picks up the chosen size + orientation exactly.
     ========================================================================= */

  :root {
    /* Palette — Polymath general (soft orange accent for a "study notes" feel) */
    --bg-page:        #FAFAFA;
    --bg-card:        #FFFFFF;
    --bg-soft:        #F7F7F5;
    --bg-faint:       #F3F3F0;

    --border-faint:   #ECECE8;
    --border-soft:    #DDDDD8;
    --border-medium:  #C2C2BC;

    --text-dark:      #1A1A1A;
    --text-medium:    #4A4A4A;
    --text-soft:      #7A7A7A;
    --text-faint:     #B0B0B0;

    /* Soft warm orange accent for "cheatsheet" mood */
    --accent-soft:    #FFE0B2;
    --accent:         #FFB74D;
    --accent-strong:  #FB8C00;
    --accent-bg:      #FFF3E0;

    --success:        #66BB6A;
    --success-strong: #43A047;
    --success-bg:     #F1F8E9;

    --danger-soft:    #FFCDD2;
    --danger:         #EF5350;
    --danger-strong:  #C62828;
    --danger-bg:      #FFEBEE;

    /* Tile colour palette — pastel chips users pick from */
    --tile-1: #FFFFFF;  /* white */
    --tile-2: #FFF3E0;  /* warm cream */
    --tile-3: #E3F2FD;  /* science blue */
    --tile-4: #F1F8E9;  /* math mint */
    --tile-5: #F3E5F5;  /* lavender */
    --tile-6: #FFEBEE;  /* coral */
    --tile-7: #FFF9C4;  /* sunny */
    --tile-8: #E0F2F1;  /* teal */

    /* Shadows */
    --shadow-1: 0 1px 2px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.06);
    --shadow-2: 0 2px 4px rgba(0,0,0,0.06), 0 6px 18px rgba(0,0,0,0.09);
    --shadow-3: 0 4px 8px rgba(0,0,0,0.07), 0 12px 32px rgba(0,0,0,0.12);

    --space-2xs: 4px;
    --space-xs:  8px;
    --space-sm:  12px;
    --space-md:  16px;
    --space-lg:  24px;
    --space-xl:  36px;

    --radius-sm:   6px;
    --radius-md:   10px;
    --radius-lg:   16px;
    --radius-xl:   22px;
    --radius-pill: 999px;

    --font-stack: 'RobotoQuestion', 'Century Gothic', CenturyGothic, AppleGothic, 'Trebuchet MS', sans-serif;
    --font-stack-mono: ui-monospace, Menlo, monospace;

    --transition-fast: 0.15s ease;
    --transition: 0.25s ease;
  }

  /* Replace Century Gothic's question mark with Roboto's — house rule. */
  @font-face {
    font-family: 'RobotoQuestion';
    font-style: normal; font-weight: 400;
    src: url(https://fonts.gstatic.com/s/roboto/v32/KFOmCnqEu92Fr1Mu4mxKKTU1Kg.woff2) format('woff2');
    unicode-range: U+003F;
  }
  @font-face {
    font-family: 'RobotoQuestion';
    font-style: normal; font-weight: 700;
    src: url(https://fonts.gstatic.com/s/roboto/v32/KFOlCnqEu92Fr1MmWUlfBBc4.woff2) format('woff2');
    unicode-range: U+003F;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font-stack);
    color: var(--text-dark);
    background: var(--bg-page);
    line-height: 1.55;
    min-height: 100vh;
  }
  button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }
  img { max-width: 100%; display: block; }

  /* =========================================================================
     HEADER + TOOLBAR
     ========================================================================= */
  .polymath-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-md) var(--space-xl);
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-faint);
    box-shadow: var(--shadow-1);
    position: sticky; top: 0; z-index: 100;
  }
  .polymath-logo {
    height: 56px;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .header-title {
    flex: 1; text-align: center;
    font-weight: 700; letter-spacing: 0.02em;
    font-size: 1.15rem;
  }
  .header-title small {
    display: block; margin-top: 2px; font-size: 0.78rem;
    font-weight: 400; color: var(--text-soft);
  }
  .header-tools { display: flex; gap: var(--space-xs); }

  /* =========================================================================
     BUTTONS
     ========================================================================= */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    background: var(--bg-card);
    color: var(--text-dark);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius-md);
    font-size: 0.92rem; font-weight: 600;
    box-shadow: var(--shadow-1);
    transition: all var(--transition);
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-2);
    border-color: var(--accent);
    color: var(--accent-strong);
  }
  .btn:active { transform: translateY(0.5px); box-shadow: var(--shadow-1); }
  .btn-primary {
    background: var(--accent-strong); color: #fff; border-color: var(--accent-strong);
  }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-danger { color: var(--danger-strong); border-color: var(--danger-soft); }
  .btn-danger:hover { background: var(--danger-bg); color: var(--danger-strong); border-color: var(--danger); }
  .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
  .btn-icon { padding: 8px 10px; font-size: 1rem; min-width: 38px; }
  .btn:disabled, .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

  /* =========================================================================
     CONTROL BAR (page settings, sheet title, actions)
     ========================================================================= */
  .control-bar {
    max-width: 1500px; margin: 0 auto;
    padding: var(--space-lg) var(--space-xl) var(--space-sm);
    display: flex; flex-direction: column; gap: var(--space-sm);
  }
  .control-row {
    display: flex; flex-wrap: wrap; gap: var(--space-sm);
    align-items: center;
  }
  .ctl-group {
    display: inline-flex; gap: 8px; align-items: center;
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-1);
  }
  .ctl-group label {
    font-size: 0.78rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-soft);
  }
  .ctl-group select, .ctl-group input[type="text"] {
    padding: 4px 8px;
    border: 1px solid var(--border-faint);
    border-radius: var(--radius-sm);
    background: var(--bg-soft);
    font-size: 0.9rem;
  }
  .ctl-group select:focus, .ctl-group input:focus {
    outline: none; border-color: var(--accent); background: #fff;
  }

  .title-input, .subtitle-input {
    flex: 1; min-width: 240px;
    padding: 10px 16px;
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius-md);
    background: var(--bg-card);
    font-size: 1.05rem; font-weight: 600;
    box-shadow: var(--shadow-1);
  }
  .subtitle-input { font-size: 0.92rem; font-weight: 400; }
  .title-input:focus, .subtitle-input:focus {
    outline: none; border-color: var(--accent);
  }

  /* Save status pill */
  .save-state {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    background: var(--success-bg);
    color: var(--success-strong);
    border: 1px solid #C8E6C9;
    border-radius: var(--radius-pill);
    font-size: 0.78rem; font-weight: 600;
  }
  .save-state.saving { background: var(--accent-bg); color: var(--accent-strong); border-color: var(--accent-soft); }
  .save-state .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* =========================================================================
     PAGE WORKSPACE — paper sheet with absolutely-positioned tiles inside
     ========================================================================= */
  .workspace {
    max-width: 1500px; margin: 0 auto;
    padding: var(--space-sm) var(--space-xl) var(--space-xl);
    display: flex; flex-direction: column; align-items: center;
    gap: var(--space-lg);
  }

  .sheet-wrap {
    /* Scaling container — the actual sheet uses real mm dimensions for
       the printer; we scale this wrapper down via CSS transform so it
       fits on screen. The transform is set inline by JS. */
    transform-origin: top center;
    margin-bottom: -2vh; /* swallow some empty space from the scale */
  }

  .sheet {
    position: relative;
    background: #fff;
    box-shadow: var(--shadow-2);
    border-radius: 4px;
    /* Width / height set inline by JS based on page size + orientation. */
    width: var(--sheet-w, 210mm);
    height: var(--sheet-h, 297mm);
    overflow: hidden;
    /* The interior grid (subtle dotted background) helps users align tiles
       visually. Each cell = 5mm. */
    background-image:
      radial-gradient(circle at 1px 1px, #DDD 0.7px, transparent 0);
    background-size: 5mm 5mm;
  }

  /* Safe-print zone outline — dashed, behind tiles */
  .sheet-safe-zone {
    position: absolute;
    inset: var(--sheet-margin, 10mm);
    border: 1px dashed var(--accent);
    border-radius: 1px;
    pointer-events: none;
    z-index: 0;
  }

  /* Sheet header — title + subtitle drawn on the page */
  .sheet-header {
    position: absolute;
    left: var(--sheet-margin, 10mm);
    right: var(--sheet-margin, 10mm);
    top: var(--sheet-margin, 10mm);
    pointer-events: none;
    z-index: 0;
  }
  .sheet-header-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  .sheet-header-subtitle {
    font-size: 0.9rem;
    color: var(--text-soft);
    margin-top: 2px;
  }
  .sheet-header-divider {
    margin-top: 5mm;
    height: 1.5px;
    background: var(--accent);
    width: 30mm;
  }

  /* Footer logo + copyright on every printed sheet */
  .sheet-footer-logo {
    position: absolute;
    right: var(--sheet-margin, 10mm);
    bottom: 4mm;
    height: var(--sheet-logo-h, 10mm);
    width: auto;
    pointer-events: none;
    z-index: 0;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .sheet-footer-notice {
    position: absolute;
    left: var(--sheet-margin, 10mm);
    right: calc(var(--sheet-margin, 10mm) + 35mm);
    bottom: 4mm;
    font-size: 0.55rem;
    line-height: 1.25;
    color: #BBBBBB;
    font-style: italic;
    pointer-events: none;
    z-index: 0;
  }

  /* =========================================================================
     TILE
     -------------------------------------------------------------------------
     Modular rectangle. Absolutely-positioned inside the sheet, in mm.
     Has a header strip (drag handle + delete) + body (rich text + image),
     8 resize handles (visible on hover or when selected), per-tile colour.
     ========================================================================= */
  .tile {
    position: absolute;
    background: var(--tile-bg, #fff);
    border: 1.5px solid var(--tile-border, #DDD);
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
    overflow: visible; /* handles need to extend slightly outside */
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    z-index: 1;
  }
  .tile:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.1); z-index: 2; }
  .tile.selected {
    border-color: var(--accent-strong);
    box-shadow: 0 0 0 1.5px var(--accent-strong), 0 4px 12px rgba(251,140,0,0.18);
    z-index: 10;
  }
  .tile.dragging { transition: none; opacity: 0.85; cursor: grabbing; }
  .tile.resizing { transition: none; }

  /* Header strip — visible on hover or selection */
  .tile-header {
    height: 18px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
    background: rgba(0,0,0,0.04);
    border-bottom: 1px solid var(--tile-border, #DDD);
    border-radius: 3px 3px 0 0;
    font-size: 0.6rem;
    color: var(--text-soft);
    cursor: move;
    user-select: none;
    opacity: 0;
    transition: opacity var(--transition-fast);
  }
  .tile:hover .tile-header,
  .tile.selected .tile-header { opacity: 1; }
  .tile-header-tag {
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding-left: 4px;
  }
  .tile-header-actions { display: flex; gap: 2px; }
  .tile-mini-btn {
    width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 3px;
    color: var(--text-soft);
    font-size: 0.7rem; line-height: 1;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .tile-mini-btn:hover { background: rgba(0,0,0,0.08); color: var(--text-dark); }
  .tile-mini-btn.danger:hover { background: var(--danger-bg); color: var(--danger-strong); }

  /* Tile body — rich-text + image */
  .tile-body {
    flex: 1;
    padding: 8px 10px;
    overflow: hidden;
    font-size: var(--tile-font, 0.95rem);
    line-height: 1.4;
    color: var(--text-dark);
    /* Stacking order driven by data attribute: 'above' | 'below' */
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }
  .tile-body[data-placement="above"] { flex-direction: column-reverse; }

  /* The editable text. Always contenteditable when the tile is in
     edit mode; we toggle the attribute from JS. */
  .tile-text {
    outline: none;
    min-height: 1.2em;
    border-radius: 2px;
    transition: background 0.15s ease, box-shadow 0.15s ease;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .tile-text:empty::before {
    content: 'Type your notes here…';
    color: var(--text-faint);
    font-style: italic;
    pointer-events: none;
  }
  .tile-text:focus {
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 0 1px var(--accent-soft);
  }

  /* List spacing in em so bullets/numbers scale with the text. */
  .tile-text ul,
  .tile-text ol {
    margin: 0.35em 0 0.35em 1.6em;
    padding-left: 0.4em;
  }
  .tile-text li { margin: 0.15em 0; }
  .tile-text p { margin-bottom: 0.4em; }
  .tile-text p:last-child { margin-bottom: 0; }

  /* Image slot inside a tile */
  .tile-image-wrap {
    position: relative;
    align-self: center;
    /* Width set inline (scale × tile body width). */
    max-width: 100%;
  }
  .tile-image-wrap img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .tile-image-shield {
    position: absolute; inset: 0;
    cursor: move;
    z-index: 4;
  }

  /* PowerPoint-style resize handles (8 around the perimeter). Hidden
     until the tile is selected. */
  .tile-handle {
    position: absolute;
    width: 9px; height: 9px;
    background: #fff;
    border: 1.5px solid var(--accent-strong);
    border-radius: 2px;
    z-index: 20;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    pointer-events: none;
    opacity: 0;
    transition: opacity var(--transition-fast);
  }
  .tile.selected .tile-handle { opacity: 1; pointer-events: auto; }
  .tile-handle.nw { top: -5px;    left: -5px;     cursor: nwse-resize; }
  .tile-handle.n  { top: -5px;    left: 50%;      transform: translateX(-50%); cursor: ns-resize; }
  .tile-handle.ne { top: -5px;    right: -5px;    cursor: nesw-resize; }
  .tile-handle.e  { top: 50%;     right: -5px;    transform: translateY(-50%); cursor: ew-resize; }
  .tile-handle.se { bottom: -5px; right: -5px;    cursor: nwse-resize; }
  .tile-handle.s  { bottom: -5px; left: 50%;      transform: translateX(-50%); cursor: ns-resize; }
  .tile-handle.sw { bottom: -5px; left: -5px;     cursor: nesw-resize; }
  .tile-handle.w  { top: 50%;     left: -5px;     transform: translateY(-50%); cursor: ew-resize; }

  /* For image handles inside a tile (when the tile's image is selected). */
  .tile-image-handle {
    position: absolute;
    width: 8px; height: 8px;
    background: #fff;
    border: 1.4px solid var(--accent-strong);
    border-radius: 2px;
    z-index: 6;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    opacity: 0;
    transition: opacity var(--transition-fast);
  }
  .tile-image-wrap.image-selected { outline: 1.4px dashed var(--accent-strong); outline-offset: 1px; }
  .tile-image-wrap.image-selected .tile-image-handle { opacity: 1; }
  .tile-image-handle.nw { top: -4px;    left: -4px;     cursor: nwse-resize; }
  .tile-image-handle.n  { top: -4px;    left: 50%;      transform: translateX(-50%); cursor: ns-resize; }
  .tile-image-handle.ne { top: -4px;    right: -4px;    cursor: nesw-resize; }
  .tile-image-handle.e  { top: 50%;     right: -4px;    transform: translateY(-50%); cursor: ew-resize; }
  .tile-image-handle.se { bottom: -4px; right: -4px;    cursor: nwse-resize; }
  .tile-image-handle.s  { bottom: -4px; left: 50%;      transform: translateX(-50%); cursor: ns-resize; }
  .tile-image-handle.sw { bottom: -4px; left: -4px;     cursor: nesw-resize; }
  .tile-image-handle.w  { top: 50%;     left: -4px;     transform: translateY(-50%); cursor: ew-resize; }

  /* Snap guides — coloured lines drawn over the sheet while dragging.
     JS positions and toggles them. */
  .snap-guide {
    position: absolute;
    background: var(--accent-strong);
    box-shadow: 0 0 4px rgba(251,140,0,0.6);
    pointer-events: none;
    z-index: 50;
    display: none;
  }
  .snap-guide.v { width: 1px; }
  .snap-guide.h { height: 1px; }
  .snap-guide.active { display: block; }
  .snap-guide.center { background: var(--success-strong); box-shadow: 0 0 5px rgba(67,160,71,0.6); }

  /* Live measurement pill while dragging */
  .drag-readout {
    position: absolute;
    background: #1A1A1A;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    pointer-events: none;
    display: none;
  }
  .drag-readout.active { display: block; }

  /* =========================================================================
     FLOATING TILE INSPECTOR  (appears beside selected tile)
     ========================================================================= */
  .inspector {
    position: fixed;
    top: 84px;
    right: 24px;
    width: 280px;
    max-height: calc(100vh - 110px);
    background: var(--bg-card);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-3);
    z-index: 200;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .inspector.open { display: flex; }

  .inspector-header {
    padding: 10px 14px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border-faint);
    display: flex; justify-content: space-between; align-items: center;
  }
  .inspector-header h4 {
    font-size: 0.92rem; font-weight: 700;
    color: var(--text-dark);
    letter-spacing: 0.02em;
  }
  .inspector-close {
    width: 26px; height: 26px;
    border-radius: 50%;
    color: var(--text-soft);
    font-size: 1.05rem;
    transition: background var(--transition-fast);
  }
  .inspector-close:hover { background: var(--border-faint); color: var(--text-dark); }

  .inspector-body {
    overflow-y: auto;
    padding: var(--space-md);
    display: flex; flex-direction: column;
    gap: var(--space-md);
  }
  .insp-section { display: flex; flex-direction: column; gap: 6px; }
  .insp-label {
    font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-soft);
  }

  /* Inline rich-text toolbar inside the inspector */
  .rt-toolbar {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 6px;
    background: var(--bg-soft);
    border: 1px solid var(--border-faint);
    border-radius: var(--radius-md);
  }
  .rt-group { display: flex; gap: 2px; padding-right: 6px; border-right: 1px solid var(--border-soft); }
  .rt-group:last-child { border-right: none; }
  .rt-btn {
    min-width: 28px; height: 28px;
    padding: 0 7px;
    border-radius: 4px;
    font-weight: 700; font-size: 0.78rem;
    color: var(--text-medium);
    background: transparent;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all var(--transition-fast);
  }
  .rt-btn:hover { background: var(--accent-bg); color: var(--accent-strong); }
  .rt-btn.active { background: var(--accent-strong); color: #fff; }
  .rt-btn[data-cmd="bold"] { font-weight: 800; }
  .rt-btn[data-cmd="italic"] { font-style: italic; }
  .rt-btn[data-cmd="underline"] { text-decoration: underline; }
  .rt-select {
    height: 28px;
    padding: 0 6px;
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    font-size: 0.78rem;
    background: var(--bg-card);
  }
  .rt-color {
    width: 28px; height: 28px;
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    background: transparent;
    padding: 2px;
    cursor: pointer;
  }

  /* Colour-chip picker for tile background */
  .colour-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
  }
  .colour-chip {
    aspect-ratio: 1;
    border: 2px solid var(--border-soft);
    border-radius: 6px;
    cursor: pointer;
    transition: transform var(--transition-fast), border-color var(--transition-fast);
  }
  .colour-chip:hover { transform: scale(1.08); border-color: var(--accent); }
  .colour-chip.active { border-color: var(--accent-strong); box-shadow: 0 0 0 2px var(--accent-soft); }

  /* Image picker zone */
  .insp-image-zone {
    border: 2px dashed var(--border-medium);
    border-radius: var(--radius-md);
    padding: 14px;
    background: var(--bg-soft);
    text-align: center;
    cursor: pointer;
    color: var(--text-soft);
    font-size: 0.85rem;
    transition: all var(--transition-fast);
    outline: none;
  }
  .insp-image-zone:hover, .insp-image-zone:focus,
  .insp-image-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-bg);
    color: var(--accent-strong);
  }
  .insp-image-zone img {
    max-height: 80px; margin: 0 auto;
  }

  .insp-row {
    display: grid;
    grid-template-columns: 70px 1fr 50px;
    gap: 8px;
    align-items: center;
  }
  .insp-row label {
    font-size: 0.78rem;
    color: var(--text-medium);
    font-weight: 600;
  }
  .insp-row input[type="range"] {
    width: 100%;
    accent-color: var(--accent-strong);
  }
  .insp-row .read {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent-strong);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .insp-toggle-row {
    display: flex; gap: 6px;
  }
  .insp-toggle-row .btn-sm { flex: 1; }
  .insp-toggle-row .btn-sm.active {
    background: var(--accent-strong);
    color: #fff;
    border-color: var(--accent-strong);
  }

  /* =========================================================================
     EMPTY STATE
     ========================================================================= */
  .empty-state-overlay {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-md);
    pointer-events: none;
    z-index: 0;
    color: var(--text-soft);
  }
  .empty-state-overlay .es-icon { font-size: 3rem; opacity: 0.3; }
  .empty-state-overlay .es-text {
    font-size: 1rem; font-weight: 600;
    max-width: 240px; text-align: center;
    color: var(--text-soft);
  }
  .empty-state-overlay .es-hint {
    font-size: 0.82rem; color: var(--text-faint);
    text-align: center;
  }

  /* =========================================================================
     TOAST
     ========================================================================= */
  #toastStack {
    position: fixed; bottom: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 1000;
    pointer-events: none;
  }
  .toast {
    background: var(--text-dark); color: #fff;
    padding: 10px 16px;
    border-radius: var(--radius-md);
    font-size: 0.88rem;
    box-shadow: var(--shadow-3);
    max-width: 320px;
    animation: toast-in 0.25s ease forwards, toast-out 0.3s ease 2.5s forwards;
    opacity: 0;
  }
  .toast.success { background: var(--success-strong); }
  .toast.error { background: var(--danger-strong); }
  @keyframes toast-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }

  /* =========================================================================
     PRINT STYLES
     ========================================================================= */
  /* The @page rule itself is injected into #pagePrintRule by JS so it
     matches the chosen page size + orientation. */
  @media print {
    body { background: #fff; }
    .polymath-header, .control-bar, .inspector, #toastStack,
    .empty-state-overlay { display: none !important; }
    .workspace { padding: 0; max-width: none; gap: 0; }
    .sheet-wrap {
      transform: none !important;
      margin: 0 !important;
      box-shadow: none;
    }
    .sheet {
      box-shadow: none;
      border-radius: 0;
      page-break-after: always;
      background-image: none; /* hide the dotted grid */
    }
    .sheet:last-child { page-break-after: auto; }
    .sheet-safe-zone { display: none; }
    .tile {
      box-shadow: none !important;
      border-color: var(--tile-border, #BBB) !important;
      transition: none !important;
    }
    .tile.selected { outline: none; box-shadow: none !important; }
    .tile-header { display: none !important; } /* hide the drag chrome */
    .tile-handle, .tile-image-handle { display: none !important; }
    .tile-image-shield { display: none !important; }
    .tile-body { padding: 8px 10px; }
    .snap-guide, .drag-readout { display: none !important; }
    .sheet-footer-logo, .sheet-footer-notice {
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
  }

  /* =========================================================================
     RESPONSIVE
     ========================================================================= */
  @media (max-width: 900px) {
    .polymath-header { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
    .header-title { order: 3; flex-basis: 100%; }
    .control-bar { padding: 12px 16px; }
    .inspector { right: 8px; width: calc(100% - 16px); max-width: 280px; }
  }
</style>

<!-- Dynamic @page rule — JS writes the chosen page size into this element
     so the printed PDF uses the right paper. -->
<style id="pagePrintRule">@page { size: A4 portrait; margin: 0; }</style>
</head>
